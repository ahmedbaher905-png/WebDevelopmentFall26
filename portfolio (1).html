<!DOCTYPE html>
<html>
<head>
<title>My Portfolio</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    background-color: #f4f4f4;
    color: #333;
  }
  header {
    background-color: #555;
    color: white;
    text-align: center;
    padding: 20px;
  }
  section {
    max-width: 700px;
    margin: 30px auto;
    text-align: center;
  }
  .project {
    display: inline-block;
    width: 180px;
    background-color: white;
    border: 1px solid #ddd;
    padding: 10px;
    margin: 5px;
    vertical-align: top;
    text-align: left;
  }
  input, textarea {
    width: 300px;
    padding: 8px;
  }
  button {
    width: 318px;
    padding: 10px;
    background-color: #555;
    color: white;
    border: none;
  }
</style>
</head>
<body>

<header>
  <h1>Ahmed Baher</h1>
  <p>Web Developer | Student</p>
</header>

<section id="about">
  <h2>About Me</h2>
  <p>Hello! I'm a student who loves coding and building websites.</p>
</section>

<section id="projects">
  <h2>Projects</h2>
  <div class="project">
    <h3>Compilers</h3>
    <p>Design a Compiler using JASON.</p>
  </div>
  <div class="project">
    <h3>Operating Systems</h3>
    <p>FOS Operating System using C.</p>
  </div>
  <div class="project">
    <h3>Algorithms</h3>
    <p>Design Efficient Algorithm.</p>
  </div>
</section>

<section id="contact">
  <h2>Contact Me</h2>
  <form>
    <input type="text" placeholder="Your Name"><br><br>
    <input type="email" placeholder="Your Email"><br><br>
    <textarea rows="4" placeholder="Your Message"></textarea><br><br>
    <button type="submit">Send Message</button>
  </form>
</section>


</body>
</html>
